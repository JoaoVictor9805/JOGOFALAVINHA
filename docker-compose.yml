services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: escape_room_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
